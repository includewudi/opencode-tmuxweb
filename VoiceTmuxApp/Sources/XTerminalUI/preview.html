<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceTmux Terminal Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* --- iPhone 16 Pro Max Frame --- */
        .phone-frame {
            width: 440px;
            height: 956px;
            border-radius: 55px;
            border: 4px solid #333;
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 0 2px #111,
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Dynamic Island */
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #111;
            border-radius: 20px;
            z-index: 100;
        }

        /* Home indicator */
        .phone-frame::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            z-index: 100;
        }

        /* Safe area viewport — pushes content below Dynamic Island, above Home indicator */
        .safe-viewport {
            position: absolute;
            top: 54px;
            /* Below Dynamic Island */
            left: 0;
            right: 0;
            bottom: 34px;
            /* Above Home indicator */
            overflow: hidden;
        }

        .safe-viewport iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <h1>VoiceTmux · App Preview (iPhone 16 Pro Max)</h1>

    <div class="phone-frame">
        <div class="safe-viewport">
            <iframe src="/" allow="microphone"></iframe>
        </div>
    </div>
</body>

</html>
