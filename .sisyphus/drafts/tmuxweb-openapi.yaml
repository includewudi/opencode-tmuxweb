openapi: 3.0.3
info:
  title: TmuxWeb API
  description: |
    API for TmuxWeb - a web-based tmux session manager with task tracking,
    conversation logging, and summary generation capabilities.
    
    ## Authentication
    TmuxWeb uses cookie-based session authentication:
    - Login with a token via `POST /api/auth/login`
    - Session cookie is HttpOnly, Max-Age=30 days, SameSite=Lax, Secure in production
    - All authenticated endpoints require a valid session cookie
    
    ## paneKey Format
    The paneKey identifies a specific tmux pane: `"{sessionName}:{windowIndex}:{paneIndex}"`
    
    Example: `"hsk:1:0"` = session "hsk", window 1, pane 0
  version: 1.0.0
  contact:
    name: TmuxWeb
servers:
  - url: http://localhost:8215
    description: Local development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Profiles
    description: User profile/workspace management
  - name: Groups
    description: Session group management
  - name: Ordering
    description: Session/group ordering per profile
  - name: Panes
    description: Pane status management
  - name: Tasks
    description: Task and segment management
  - name: Logs
    description: Conversation and command logging
  - name: Summaries
    description: Summary generation and loading
  - name: Health
    description: Health check endpoints

paths:
  # ============================================================================
  # Auth
  # ============================================================================
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with token
      description: |
        Authenticate with a token and receive an HttpOnly session cookie.
        Cookie settings: Max-Age=30 days, SameSite=Lax, Secure in production.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              token: "my-secret-token"
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: HttpOnly session cookie
              schema:
                type: string
                example: "session=abc123; HttpOnly; Max-Age=2592000; SameSite=Lax; Path=/"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                message: "Login successful"
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "unauthorized"
                message: "Invalid token"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear session
      description: Clears the session cookie
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Cleared session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true

  # ============================================================================
  # Profiles
  # ============================================================================
  /api/profiles:
    get:
      tags: [Profiles]
      summary: List profiles for current token
      description: Returns all profiles (workspaces) for the authenticated user
      operationId: listProfiles
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
              example:
                profiles:
                  - id: 1
                    profile_key: "default"
                    name: "Default"
                    ctime: 1707400000
                    mtime: 1707400000
                  - id: 2
                    profile_key: "work"
                    name: "Work"
                    ctime: 1707400100
                    mtime: 1707400100
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Profiles]
      summary: Create a new profile
      operationId: createProfile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
            example:
              name: "Personal"
              profile_key: "personal"
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                id: 3
                profile_key: "personal"
                name: "Personal"
                ctime: 1707400200
                mtime: 1707400200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Profile ID

    put:
      tags: [Profiles]
      summary: Update a profile
      operationId: updateProfile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              name: "Personal Projects"
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Profiles]
      summary: Delete a profile
      operationId: deleteProfile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Profile deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Session Groups
  # ============================================================================
  /api/groups:
    get:
      tags: [Groups]
      summary: List session groups
      description: Returns all groups for current profile with session counts
      operationId: listGroups
      security:
        - cookieAuth: []
      parameters:
        - name: profile_key
          in: query
          required: true
          schema:
            type: string
          description: Profile key to filter groups
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
              example:
                groups:
                  - id: 1
                    group_name: "AI Projects"
                    sort_order: 10
                    session_count: 3
                    ctime: 1707400000
                    mtime: 1707400000
                  - id: 2
                    group_name: "DevOps"
                    sort_order: 20
                    session_count: 2
                    ctime: 1707400100
                    mtime: 1707400100
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Groups]
      summary: Create a session group
      operationId: createGroup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
            example:
              profile_key: "default"
              group_name: "New Project"
              sort_order: 30
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
              example:
                id: 3
                group_name: "New Project"
                sort_order: 30
                ctime: 1707400200
                mtime: 1707400200
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Group ID

    put:
      tags: [Groups]
      summary: Update a group
      description: Update group name and/or sort_order
      operationId: updateGroup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
            example:
              group_name: "Renamed Project"
              sort_order: 15
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Groups]
      summary: Delete a group
      description: Sessions in this group become ungrouped
      operationId: deleteGroup
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  affected_sessions:
                    type: integer
                    description: Number of sessions that became ungrouped
              example:
                success: true
                affected_sessions: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{id}/group:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Session meta ID

    put:
      tags: [Groups]
      summary: Assign session to group
      description: Move session to a group or set null for ungrouped
      operationId: assignSessionGroup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignGroupRequest'
            example:
              group_id: 1
      responses:
        '200':
          description: Session group assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Ordering
  # ============================================================================
  /api/profiles/{id}/order:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Profile ID

    get:
      tags: [Ordering]
      summary: Get current order for profile
      description: Returns ordered list of groups and sessions for the profile
      operationId: getOrder
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                order:
                  - type: "session"
                    session_name: "dify"
                    sort_order: 10
                  - type: "group"
                    group_id: 1
                    group_name: "AI Projects"
                    sort_order: 10
                    sessions:
                      - session_name: "hsk"
                        sort_order: 10
                      - session_name: "omo"
                        sort_order: 20
                  - type: "session"
                    session_name: "misc"
                    sort_order: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Ordering]
      summary: Save new order for profile
      description: Updates sort_order for groups and sessions
      operationId: updateOrder
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
            example:
              order:
                - type: "group"
                  group_id: 1
                  sort_order: 5
                  sessions:
                    - session_name: "omo"
                      sort_order: 10
                    - session_name: "hsk"
                      sort_order: 20
                - type: "session"
                  session_name: "dify"
                  sort_order: 10
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Pane Status
  # ============================================================================
  /api/panes/status:
    get:
      tags: [Panes]
      summary: Get status for pane(s)
      description: Returns pane status (idle/in_progress/done) for specified panes
      operationId: getPaneStatus
      security:
        - cookieAuth: []
      parameters:
        - name: pane_keys
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: "Pane keys (format: sessionName:windowIndex:paneIndex)"
          example: ["hsk:1:0", "hsk:1:1"]
      responses:
        '200':
          description: Pane statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaneStatusListResponse'
              example:
                statuses:
                  "hsk:1:0":
                    pane_status: "in_progress"
                  "hsk:1:1":
                    pane_status: "idle"
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Panes]
      summary: Update pane status
      description: Set pane status to idle, in_progress, or done
      operationId: updatePaneStatus
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaneStatusRequest'
            example:
              pane_key: "hsk:1:0"
              pane_status: "done"
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pane_key:
                    type: string
                  pane_status:
                    type: string
              example:
                success: true
                pane_key: "hsk:1:0"
                pane_status: "done"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # Tasks & Segments
  # ============================================================================
  /api/panes/{paneKey}/tasks:
    parameters:
      - name: paneKey
        in: path
        required: true
        schema:
          type: string
        description: "Pane key (format: sessionName:windowIndex:paneIndex)"
        example: "hsk:1:0"

    get:
      tags: [Tasks]
      summary: List tasks for pane
      description: Returns all tasks (segments) for the specified pane
      operationId: listTasks
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Max tasks to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
              example:
                tasks:
                  - id: 123
                    task_title: "Auth implementation"
                    task_status: "in_progress"
                    started_at: 1707400000
                    completed_at: 0
                  - id: 122
                    task_title: "Database setup"
                    task_status: "completed"
                    started_at: 1707300000
                    completed_at: 1707350000
                total: 2
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Tasks]
      summary: Create new task
      description: Creates a new task (segment) for the pane
      operationId: createTask
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              task_title: "Implement login endpoint"
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 124
                session_name: "hsk"
                window_index: 1
                window_name: "zsh"
                pane_index: 0
                task_title: "Implement login endpoint"
                task_status: "in_progress"
                started_at: 1707400300
                completed_at: 0
                ctime: 1707400300
                mtime: 1707400300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Task (segment) ID

    put:
      tags: [Tasks]
      summary: Update task
      description: Update task title and/or status
      operationId: updateTask
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example:
              task_title: "Implement login endpoint with OAuth"
              task_status: "completed"
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Task ID

    post:
      tags: [Tasks]
      summary: Mark task as done
      description: Marks the task as completed with current timestamp
      operationId: completeTask
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Task marked complete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 123
                task_title: "Auth implementation"
                task_status: "completed"
                started_at: 1707400000
                completed_at: 1707450000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tasks/{id}/detail:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Task ID

    get:
      tags: [Tasks]
      summary: Get task with logs and summaries
      description: Returns complete task details including conversation logs, commands, and summaries
      operationId: getTaskDetail
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
              example:
                task:
                  id: 123
                  task_title: "Auth implementation"
                  task_status: "in_progress"
                  started_at: 1707400000
                  completed_at: 0
                conversation:
                  - id: 1
                    role: "user"
                    content: "Please add login endpoint"
                    msg_time: 1707400100
                  - id: 2
                    role: "assistant"
                    content: "I'll create POST /api/auth/login..."
                    msg_time: 1707400150
                commands:
                  - id: 1
                    command: "npm install jsonwebtoken"
                    cmd_time: 1707400200
                    exit_code: 0
                summary:
                  command_summary: "Setup JWT auth with cookie-based..."
                  output_summary: "Successfully implemented login..."
                  summary_status: "done"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Logs
  # ============================================================================
  /api/segments/{id}/conversation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Segment ID

    post:
      tags: [Logs]
      summary: Add conversation message
      description: Add a user or assistant message to the segment
      operationId: addConversation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConversationRequest'
            example:
              role: "user"
              content: "Please add logout endpoint"
      responses:
        '201':
          description: Message added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
              example:
                id: 5
                segment_id: 123
                role: "user"
                content: "Please add logout endpoint"
                msg_time: 1707400500
                ctime: 1707400500
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/segments/{id}/commands:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Segment ID

    post:
      tags: [Logs]
      summary: Add command record
      description: Record a command executed in the terminal
      operationId: addCommand
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommandRequest'
            example:
              command: "curl -X POST localhost:8215/api/auth/login -d '{\"token\":\"test\"}'"
              exit_code: 0
      responses:
        '201':
          description: Command recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandRecord'
              example:
                id: 15
                segment_id: 123
                command: "curl -X POST localhost:8215/api/auth/login -d '{\"token\":\"test\"}'"
                cmd_time: 1707400600
                exit_code: 0
                ctime: 1707400600
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/segments/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Segment ID

    get:
      tags: [Logs]
      summary: Get all logs for segment
      description: Returns both conversation messages and command records
      operationId: getSegmentLogs
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Segment logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentLogsResponse'
              example:
                segment_id: 123
                conversation:
                  - id: 1
                    role: "user"
                    content: "Please add login endpoint"
                    msg_time: 1707400100
                  - id: 2
                    role: "assistant"
                    content: "I'll create POST /api/auth/login..."
                    msg_time: 1707400150
                commands:
                  - id: 1
                    command: "npm install jsonwebtoken"
                    cmd_time: 1707400200
                    exit_code: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Summaries
  # ============================================================================
  /api/tasks/{id}/summarize:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Task ID

    post:
      tags: [Summaries]
      summary: Trigger summary generation
      description: |
        Requests summary generation from external summary service.
        Returns 501 if summary service is not configured.
      operationId: triggerSummarize
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummarizeRequest'
            example:
              type: "both"
      responses:
        '202':
          description: Summary generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummarizeResponse'
              example:
                job_id: "job_abc123"
                status: "pending"
                message: "Summary generation started"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: Summary service not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "not_implemented"
                message: "Summary service not configured"

  /api/panes/{paneKey}/summary-candidates:
    parameters:
      - name: paneKey
        in: path
        required: true
        schema:
          type: string
        description: "Pane key (format: sessionName:windowIndex:paneIndex)"

    get:
      tags: [Summaries]
      summary: Find historical summaries
      description: |
        Find previous summaries for the same session name that can be loaded.
        Used when tmux session is reopened and user wants to continue from previous context.
      operationId: getSummaryCandidates
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Max candidates to return
      responses:
        '200':
          description: Summary candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryCandidatesResponse'
              example:
                session_name: "dify"
                candidates:
                  - id: 45
                    segment_id: 100
                    window_index: 1
                    window_name: "zsh"
                    command_summary: "Implemented cookie auth..."
                    output_summary: "Login endpoint working..."
                    generated_at: 1707400000
                  - id: 38
                    segment_id: 85
                    window_index: 1
                    window_name: "zsh"
                    command_summary: "Added MySQL migrations..."
                    generated_at: 1707300000
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/{id}/load-summary:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Task ID (target task to load summary into)

    post:
      tags: [Summaries]
      summary: Load/import previous summary
      description: Copy a previous summary into the current task
      operationId: loadSummary
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadSummaryRequest'
            example:
              source_summary_id: 45
      responses:
        '200':
          description: Summary loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'
              example:
                id: 50
                segment_id: 124
                command_summary: "Implemented cookie auth..."
                output_summary: "Login endpoint working..."
                summary_status: "done"
                generated_at: 1707450000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # Health
  # ============================================================================
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      description: Returns health status including database connectivity
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                db: "connected"
                timestamp: 1707450000
        '503':
          description: Unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "unhealthy"
                db: "disconnected"
                error: "Connection refused"
                timestamp: 1707450000

# ==============================================================================
# Components
# ==============================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        HttpOnly session cookie set by /api/auth/login.
        Cookie settings: Max-Age=30 days, SameSite=Lax, Secure in production.

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "unauthorized"
            message: "Authentication required"

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "bad_request"
            message: "Invalid input"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "not_found"
            message: "Resource not found"

  schemas:
    # --------------------------------------------------------------------------
    # Common
    # --------------------------------------------------------------------------
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Optional error code

    # --------------------------------------------------------------------------
    # Auth
    # --------------------------------------------------------------------------
    LoginRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: User authentication token

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    # --------------------------------------------------------------------------
    # Profiles
    # --------------------------------------------------------------------------
    Profile:
      type: object
      properties:
        id:
          type: integer
        profile_key:
          type: string
          description: Unique profile identifier (UUID or slug)
        name:
          type: string
        ctime:
          type: integer
          description: Creation timestamp
        mtime:
          type: integer
          description: Modification timestamp

    ProfileListResponse:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/Profile'

    CreateProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        profile_key:
          type: string
          description: Optional custom key (auto-generated if not provided)

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string

    # --------------------------------------------------------------------------
    # Groups
    # --------------------------------------------------------------------------
    Group:
      type: object
      properties:
        id:
          type: integer
        group_name:
          type: string
        sort_order:
          type: integer
        session_count:
          type: integer
          description: Number of sessions in this group
        ctime:
          type: integer
        mtime:
          type: integer

    GroupListResponse:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'

    CreateGroupRequest:
      type: object
      required:
        - profile_key
        - group_name
      properties:
        profile_key:
          type: string
        group_name:
          type: string
        sort_order:
          type: integer
          default: 0

    UpdateGroupRequest:
      type: object
      properties:
        group_name:
          type: string
        sort_order:
          type: integer

    AssignGroupRequest:
      type: object
      properties:
        group_id:
          type: integer
          nullable: true
          description: Group ID or null for ungrouped

    SessionMeta:
      type: object
      properties:
        id:
          type: integer
        session_name:
          type: string
        group_id:
          type: integer
          description: 0 = ungrouped
        sort_order:
          type: integer
        pane_status:
          type: string
          enum: [idle, in_progress, done]
        ctime:
          type: integer
        mtime:
          type: integer

    # --------------------------------------------------------------------------
    # Ordering
    # --------------------------------------------------------------------------
    OrderItem:
      type: object
      properties:
        type:
          type: string
          enum: [session, group]
        session_name:
          type: string
          description: Present when type=session
        group_id:
          type: integer
          description: Present when type=group
        group_name:
          type: string
          description: Present when type=group
        sort_order:
          type: integer
        sessions:
          type: array
          items:
            type: object
            properties:
              session_name:
                type: string
              sort_order:
                type: integer
          description: Present when type=group

    OrderResponse:
      type: object
      properties:
        order:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    UpdateOrderRequest:
      type: object
      required:
        - order
      properties:
        order:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    # --------------------------------------------------------------------------
    # Pane Status
    # --------------------------------------------------------------------------
    PaneStatusListResponse:
      type: object
      properties:
        statuses:
          type: object
          additionalProperties:
            type: object
            properties:
              pane_status:
                type: string
                enum: [idle, in_progress, done]

    UpdatePaneStatusRequest:
      type: object
      required:
        - pane_key
        - pane_status
      properties:
        pane_key:
          type: string
          description: "Format: sessionName:windowIndex:paneIndex"
        pane_status:
          type: string
          enum: [idle, in_progress, done]

    # --------------------------------------------------------------------------
    # Tasks
    # --------------------------------------------------------------------------
    Task:
      type: object
      properties:
        id:
          type: integer
        session_name:
          type: string
        window_index:
          type: integer
        window_name:
          type: string
        pane_index:
          type: integer
        task_title:
          type: string
        task_status:
          type: string
          enum: [in_progress, completed]
        started_at:
          type: integer
          description: Timestamp when task started
        completed_at:
          type: integer
          description: Timestamp when task completed (0 if not completed)
        ctime:
          type: integer
        mtime:
          type: integer

    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer

    CreateTaskRequest:
      type: object
      properties:
        task_title:
          type: string
          default: "Untitled"

    UpdateTaskRequest:
      type: object
      properties:
        task_title:
          type: string
        task_status:
          type: string
          enum: [in_progress, completed]

    TaskDetailResponse:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/Task'
        conversation:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CommandRecord'
        summary:
          $ref: '#/components/schemas/TaskSummary'

    # --------------------------------------------------------------------------
    # Logs
    # --------------------------------------------------------------------------
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        segment_id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        msg_time:
          type: integer
        ctime:
          type: integer

    CommandRecord:
      type: object
      properties:
        id:
          type: integer
        segment_id:
          type: integer
        command:
          type: string
        cmd_time:
          type: integer
        exit_code:
          type: integer
        ctime:
          type: integer

    AddConversationRequest:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    AddCommandRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
        exit_code:
          type: integer
          default: 0

    SegmentLogsResponse:
      type: object
      properties:
        segment_id:
          type: integer
        conversation:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/CommandRecord'

    # --------------------------------------------------------------------------
    # Summaries
    # --------------------------------------------------------------------------
    TaskSummary:
      type: object
      properties:
        id:
          type: integer
        segment_id:
          type: integer
        session_name:
          type: string
        window_index:
          type: integer
        window_name:
          type: string
        command_summary:
          type: string
        output_summary:
          type: string
        summary_job_id:
          type: string
        summary_status:
          type: string
          enum: [pending, running, done, error]
        summary_error:
          type: string
        generated_at:
          type: integer

    SummarizeRequest:
      type: object
      properties:
        type:
          type: string
          enum: [command, output, both]
          default: both
          description: Type of summary to generate

    SummarizeResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [pending, running]
        message:
          type: string

    SummaryCandidatesResponse:
      type: object
      properties:
        session_name:
          type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/TaskSummary'

    LoadSummaryRequest:
      type: object
      required:
        - source_summary_id
      properties:
        source_summary_id:
          type: integer
          description: ID of the summary to copy from

    # --------------------------------------------------------------------------
    # Health
    # --------------------------------------------------------------------------
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        db:
          type: string
          enum: [connected, disconnected]
        error:
          type: string
          description: Present only when unhealthy
        timestamp:
          type: integer
